name: CI

# Se ejecuta en cada push y en cada pull request.
on:
  push:
  pull_request:

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compilar + pruebas + ArchUnit + JaCoCo. Falla si la cobertura baja del 90%.
      - name: mvn verify
        run: mvn -B verify

      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco
          if-no-files-found: ignore

  deploy-script-tests:
    name: Pruebas de deploy.sh y su rollback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifican éxito, rollback por health, falla del rollback, variable faltante e idempotencia
      # usando un hosting simulado (no tocan ningún servicio real).
      - name: Probar deploy.sh con el hosting simulado
        run: ./scripts/test/deploy_test.sh
