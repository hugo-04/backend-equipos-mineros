# Dependabot: avisa (y abre PR) cuando una dependencia, una imagen base o una acción de GitHub tiene versión nueva
# o una vulnerabilidad corregida. Las acciones están fijadas por SHA, así que Dependabot es quien las mantiene al día.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
