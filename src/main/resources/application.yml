# Configuración base. Todo lo sensible viene del entorno (ver .env.example); nada de claves en el repo.
spring:
  application:
    name: equipos-mineros
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Si la BD no responde, /health debe fallar rápido (503) y no quedarse colgado
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo manda Flyway; Hibernate solo valida que coincida
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Rechaza propiedades desconocidas en el body
      fail-on-unknown-properties: true
    mapper:
      # "12.5" (texto) no se acepta como número: el contrato pide un number
      allow-coercion-of-scalars: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Tag de la imagen que está corriendo; lo expone /health para validar los despliegues
  version: ${APP_VERSION:dev}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  admin:
    username: ${ADMIN_USER:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
