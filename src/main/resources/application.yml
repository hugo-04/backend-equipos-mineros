# Configuración base. Acá no hay nada sensible: claves y URLs entran por variables de entorno (mira .env.example).
spring:
  application:
    name: equipos-mineros
  autoconfigure:
    # El login es con JWT contra nuestra tabla usuario. Se excluye esto para que Spring no cree su usuario por defecto con clave aleatoria.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  web:
    locale: es
    locale-resolver: fixed
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Si la BD no contesta, el /health tiene que responder 503 rápido y no quedarse esperando
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # Las tablas las crea Flyway. Hibernate solo comprueba que las entidades coincidan con ellas.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Para que el rollback funcione: una imagen anterior tiene que poder arrancar aunque la BD ya tenga migraciones
    # más nuevas que ella no conoce. Se probó con una versión que solo tenía V1 a V5 contra un esquema que ya tenía V6.
    ignore-migration-patterns: "*:future"
  jackson:
    deserialization:
      # Si el body trae una propiedad que el contrato no conoce, se rechaza (no se ignora en silencio)
      fail-on-unknown-properties: true
    mapper:
      # Un "12.5" entre comillas no se acepta donde el contrato pide un número
      allow-coercion-of-scalars: false
    default-property-inclusion: non_null

logging:
  pattern:
    # Cada línea de log lleva el traceId de su petición. El mismo id sale en el error que ve el cliente, así se puede rastrear.
    level: "%5p [traceId=%X{traceId:-}]"

server:
  port: ${PORT:8080}
  # En Railway hay un proxy delante de la app. Con esto se toma la IP y el esquema reales de X-Forwarded-*; Tomcat solo le cree a proxies internos.
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    # Contra la fuerza bruta del login: cuántos fallos se permiten por IP dentro de la ventana. Después se responde 429 con Retry-After.
    login-max-intentos: ${LOGIN_MAX_INTENTOS:10}
    login-ventana-segundos: ${LOGIN_VENTANA_SEGUNDOS:300}
    # Tamaño máximo del cuerpo de una petición, en bytes. Si lo pasa, se responde 413.
    cuerpo-max-bytes: ${CUERPO_MAX_BYTES:16384}
  # El tag de la imagen que está corriendo. El /health lo devuelve y deploy.sh lo usa para confirmar que quedó la versión nueva.
  version: ${APP_VERSION:dev}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  admin:
    username: ${ADMIN_USER:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
