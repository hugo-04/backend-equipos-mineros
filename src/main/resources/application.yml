# Configuración base. Todo lo sensible viene del entorno (ver .env.example); nada de claves en el repo.
spring:
  application:
    name: equipos-mineros
  autoconfigure:
    # La autenticacion es por JWT contra nuestra tabla usuario; no queremos el usuario por defecto de Spring
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  web:
    locale: es
    locale-resolver: fixed
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Si la BD no responde, /health debe fallar rápido (503) y no quedarse colgado
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo manda Flyway; Hibernate solo valida que coincida
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Para el ROLLBACK: una imagen anterior debe poder arrancar aunque la BD ya tenga migraciones
    # más nuevas (que esa imagen no conoce). Verificado: la versión vieja arranca contra un esquema con V6.
    ignore-migration-patterns: "*:future"
  jackson:
    deserialization:
      # Rechaza propiedades desconocidas en el body
      fail-on-unknown-properties: true
    mapper:
      # "12.5" (texto) no se acepta como número: el contrato pide un number
      allow-coercion-of-scalars: false
    default-property-inclusion: non_null

logging:
  pattern:
    # El traceId identifica la petición: sale en todos los logs y en el ErrorResponse que ve el cliente
    level: "%5p [traceId=%X{traceId:-}]"

server:
  port: ${PORT:8080}
  # Detrás del proxy del hosting: toma la IP y el esquema reales de X-Forwarded-* (Tomcat solo confía en proxies internos)
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    # Frena la fuerza bruta del login: fallos permitidos por IP dentro de la ventana (luego 429 + Retry-After)
    login-max-intentos: ${LOGIN_MAX_INTENTOS:10}
    login-ventana-segundos: ${LOGIN_VENTANA_SEGUNDOS:300}
    # Tamaño máximo del cuerpo de una petición (bytes): más grande => 413
    cuerpo-max-bytes: ${CUERPO_MAX_BYTES:16384}
  # Tag de la imagen que está corriendo; lo expone /health para validar los despliegues
  version: ${APP_VERSION:dev}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  admin:
    username: ${ADMIN_USER:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
